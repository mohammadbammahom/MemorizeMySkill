<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typography</title>
  <link rel="stylesheet" href="Typography.css" />
</head>
<body>
  <main class="article-page">
    <section class="hero-card">
      <p class="eyebrow">Product Story</p>
      <h1>Typography that sells the message</h1>
      <p class="lead">Readable spacing and rhythm keep your layout premium.</p>
    </section>

    <section class="content-grid">
      <article class="story-card">
        <h2>Editorial Layout</h2>
        <p>
          A clean content hierarchy helps users scan the article quickly and feel confident.
        </p>
      </article>

      <aside class="meta-card">
        <h3>Reading Notes</h3>
        <p>Use line-height and letter-spacing intentionally to improve readability.</p>
      </aside>
    </section>
  </main>
</body>
</html>
