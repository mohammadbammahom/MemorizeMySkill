<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pseudo Elements</title>
  <link rel="stylesheet" href="PseudoElements.css" />
</head>
<body>
  <main class="project-shell">
    <header class="site-header">
      <h1>Project Tickets</h1>
      <div class="search">
        <label class="search-label">
          <input type="search" placeholder="Search tickets..." />
        </label>
      </div>
    </header>

    <section class="tickets">
      <ul class="ticket-list">
        <li class="ticket">Deploy pipeline config</li>
        <li class="ticket">Add integration tests</li>
        <li class="ticket">Refactor header component</li>
      </ul>
    </section>
  </main>
</body>
</html>
