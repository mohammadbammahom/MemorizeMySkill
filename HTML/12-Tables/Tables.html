<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جداول</title>
    <link rel="stylesheet" href="Tables.css">
</head>
<body>
    <header>
        <h1>جداول</h1>
        <p>داده‌های structured در HTML</p>
    </header>

    <main>
        <section>
            <h2>جدول ساده</h2>
            <table>
                <thead>
                    <tr>
                        <th>نام</th>
                        <th>شغل</th>
                        <th>دستمزد</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>علی</td>
                        <td>برنامه‌نویس</td>
                        <td>۵۰۰۰۰۰ تومان</td>
                    </tr>
                    <tr>
                        <td>فاطمه</td>
                        <td>طراح</td>
                        <td>۴۰۰۰۰۰ تومان</td>
                    </tr>
                    <tr>
                        <td>محمد</td>
                        <td>مدیر</td>
                        <td>۶۰۰۰۰۰ تومان</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>جدول با Footer</h2>
            <table>
                <thead>
                    <tr>
                        <th>محصول</th>
                        <th>قیمت</th>
                        <th>تعداد</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>لپ تاپ</td>
                        <td>۲۰۰۰۰۰۰ تومان</td>
                        <td>۲</td>
                    </tr>
                    <tr>
                        <td>موس</td>
                        <td>۵۰۰۰۰ تومان</td>
                        <td>۵</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>جمع</td>
                        <td colspan="2">۲۲۵۰۰۰۰ تومان</td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
