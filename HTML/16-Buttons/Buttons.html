<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دکمه‌های HTML</title>
    <link rel="stylesheet" href="Buttons.css">
</head>
<body>
    <header>
        <h1>دکمه‌های HTML</h1>
        <p>عناصر تعاملی برای اقدامات</p>
    </header>

    <main>
        <section>
            <h2>انواع دکمه‌ها</h2>
            <div class="button-group">
                <button type="submit">ارسال</button>
                <button type="reset">پاک کردن</button>
                <button type="button">کلیک کن</button>
            </div>
        </section>

        <section>
            <h2>دکمه‌های در فرم</h2>
            <form>
                <div class="form-group">
                    <label for="email">ایمیل:</label>
                    <input type="email" id="email" name="email">
                </div>
                <button type="submit">ارسال فرم</button>
                <button type="reset">بازنشانی</button>
            </form>
        </section>

        <section>
            <h2>دکمه‌های مختلف</h2>
            <div class="button-group">
                <button class="primary">اصلی</button>
                <button class="secondary">ثانوی</button>
                <button class="danger">خطرناک</button>
                <button class="success">موفق</button>
            </div>
        </section>

        <section>
            <h2>دکمه‌های Disabled</h2>
            <div class="button-group">
                <button>فعال</button>
                <button disabled>غیرفعال</button>
            </div>
        </section>

        <section>
            <h2>دکمه با aria-label</h2>
            <div class="button-group">
                <button aria-label="بستن پنجره">✕</button>
                <button aria-label="کمکی">؟</button>
                <button aria-label="تنظیمات">⚙</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
