<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برچسب‌های فرم</title>
    <link rel="stylesheet" href="Labels.css">
</head>
<body>
    <header>
        <h1>برچسب‌های فرم</h1>
        <p>پیوند inputs و labels</p>
    </header>

    <main>
        <section>
            <h2>Label به عنوان Wrapper</h2>
            <form>
                <div class="form-group">
                    <label>
                        نام:
                        <input type="text" name="name">
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        ایمیل:
                        <input type="email" name="email">
                    </label>
                </div>
            </form>
        </section>

        <section>
            <h2>Label با for attribute</h2>
            <form>
                <div class="form-group">
                    <label for="username">نام‌کاربری:</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-group">
                    <label for="password">رمز:</label>
                    <input type="password" id="password" name="password">
                </div>
            </form>
        </section>

        <section>
            <h2>Checkbox و Radio Labels</h2>
            <form>
                <div class="form-group">
                    <input type="checkbox" id="agree" name="agree">
                    <label for="agree">من با شرایط موافقم</label>
                </div>

                <div class="form-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">مرد</label>
                </div>

                <div class="form-group">
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">زن</label>
                </div>
            </form>
        </section>

        <section>
            <h2>Required Labels</h2>
            <form>
                <div class="form-group">
                    <label for="email2">ایمیل <span class="required">*</span></label>
                    <input type="email" id="email2" name="email2" required>
                </div>

                <div class="form-group">
                    <label for="phone">تلفن <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
