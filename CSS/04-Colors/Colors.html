<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colors</title>
  <link rel="stylesheet" href="Colors.css" />
</head>
<body>
  <section class="brand-panel">
    <div class="brand-copy">
      <p class="eyebrow">Visual System</p>
      <h1>Color is a product decision, not only a visual one.</h1>
      <p>Use color hierarchy to guide attention and reduce cognitive load.</p>
      <button class="btn">Launch Demo</button>
    </div>

    <div class="swatches">
      <div class="swatch swatch--primary">Named / HEX</div>
      <div class="swatch swatch--rgb">RGB</div>
      <div class="swatch swatch--rgba">RGBA</div>
      <div class="swatch swatch--hsl">HSL</div>
      <div class="swatch swatch--hsla">HSLA</div>
    </div>
  </section>
</body>
</html>
