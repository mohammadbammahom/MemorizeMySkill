<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure و Figcaption</title>
    <link rel="stylesheet" href="FigureAndFigcaption.css">
</head>
<body>
    <header>
        <h1>Figure و Figcaption</h1>
        <p>عکس‌ها با توضیحات</p>
    </header>

    <main>
        <section>
            <h2>عکس ساده با Caption</h2>
            <figure>
                <img src="https://via.placeholder.com/500x300" alt="منظره کوهستانی">
                <figcaption>شکل ۱: منظره‌ی زیبای کوهستان</figcaption>
            </figure>
        </section>

        <section>
            <h2>نمودار با توضیح</h2>
            <figure>
                <svg width="400" height="300" viewBox="0 0 400 300">
                    <rect width="400" height="300" fill="#f0f0f0"/>
                    <text x="200" y="150" text-anchor="middle" font-size="24">نمودار</text>
                </svg>
                <figcaption>شکل ۲: نمودار رشد فروش سالانه</figcaption>
            </figure>
        </section>

        <section>
            <h2>کد با توضیح</h2>
            <figure>
                <pre><code>&lt;html&gt;
    &lt;head&gt;
        &lt;title&gt;صفحه&lt;/title&gt;
    &lt;/head&gt;
&lt;/html&gt;</code></pre>
                <figcaption>شکل ۳: ساختار HTML پایه</figcaption>
            </figure>
        </section>

        <section>
            <h2>عکس مختلف با Caption</h2>
            <figure>
                <img src="https://via.placeholder.com/600x400" alt="تیم کاری">
                <figcaption>شکل ۴: تیم توسعه‌دهندگان</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
