<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عکس‌ها</title>
    <link rel="stylesheet" href="Images.css">
</head>
<body>
    <header>
        <h1>عکس‌ها در HTML</h1>
        <p>عکس‌ها با alt text صحیح</p>
    </header>

    <main>
        <section>
            <h2>عکس ساده</h2>
            <img src="https://via.placeholder.com/400x300" alt="عکس نمونه">
        </section>

        <section>
            <h2>عکس با dimensions</h2>
            <img src="https://via.placeholder.com/500x300" alt="عکس پروفایل" width="500" height="300">
        </section>

        <section>
            <h2>عکس‌های مختلف</h2>
            <div class="gallery">
                <img src="https://via.placeholder.com/300x200" alt="عکس ۱">
                <img src="https://via.placeholder.com/300x200" alt="عکس ۲">
                <img src="https://via.placeholder.com/300x200" alt="عکس ۳">
                <img src="https://via.placeholder.com/300x200" alt="عکس ۴">
            </div>
        </section>

        <section>
            <h2>عکس با text</h2>
            <div class="card">
                <img src="https://via.placeholder.com/400x300" alt="محصول">
                <h3>محصول</h3>
                <p>توضیح محصول</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
