<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset و Legend</title>
    <link rel="stylesheet" href="FieldsetAndLegend.css">
</head>
<body>
    <header>
        <h1>Fieldset و Legend</h1>
        <p>گروه‌بندی فیلدهای فرم</p>
    </header>

    <main>
        <section>
            <h2>ساختار Fieldset</h2>
            <form>
                <fieldset>
                    <legend>اطلاعات شخصی</legend>
                    
                    <div class="form-group">
                        <label for="fname">نام:</label>
                        <input type="text" id="fname">
                    </div>

                    <div class="form-group">
                        <label for="lname">نام‌خانوادگی:</label>
                        <input type="text" id="lname">
                    </div>

                    <div class="form-group">
                        <label for="age">سن:</label>
                        <input type="number" id="age">
                    </div>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>چندین Fieldsets</h2>
            <form>
                <fieldset>
                    <legend>درخواست استخدام</legend>

                    <fieldset>
                        <legend>اطلاعات شخصی</legend>
                        <div class="form-group">
                            <label for="name1">نام:</label>
                            <input type="text" id="name1">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>مهارت‌ها</legend>
                        <div class="form-group">
                            <input type="checkbox" id="html">
                            <label for="html">HTML</label>
                        </div>
                        <div class="form-group">
                            <input type="checkbox" id="css">
                            <label for="css">CSS</label>
                        </div>
                        <div class="form-group">
                            <input type="checkbox" id="js">
                            <label for="js">JavaScript</label>
                        </div>
                    </fieldset>
                </fieldset>

                <button type="submit">ارسال</button>
            </form>
        </section>

        <section>
            <h2>Radio Group در Fieldset</h2>
            <form>
                <fieldset>
                    <legend>تجربه کاری</legend>
                    
                    <div class="form-group">
                        <input type="radio" id="junior" name="level">
                        <label for="junior">تازه‌کار</label>
                    </div>

                    <div class="form-group">
                        <input type="radio" id="senior" name="level">
                        <label for="senior">پیشرفته</label>
                    </div>

                    <div class="form-group">
                        <input type="radio" id="expert" name="level">
                        <label for="expert">خبره</label>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
