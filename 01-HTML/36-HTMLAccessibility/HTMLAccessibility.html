<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Accessibility</title>
  <link rel="stylesheet" href="HTMLAccessibility.css">
</head>
<body>
  <main class="card">
    <h1>دسترسی‌پذیری در HTML</h1>
    <nav aria-label="منوی اصلی">
      <a href="#">خانه</a>
      <a href="#">خدمات</a>
      <a href="#">تماس</a>
    </nav>

    <button aria-label="ثبت سفارش">ثبت</button>
    <label for="email">ایمیل</label>
    <input id="email" type="email" placeholder="you@example.com">
  </main>
</body>
</html>
