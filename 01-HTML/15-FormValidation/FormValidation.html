<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="FormValidation.css">
</head>
<body>
    <header>
        <h1>Form Validation</h1>
        <p>تایید اعتبار داده‌های فرم</p>
    </header>

    <main>
        <section>
            <h2>Validation Attributes</h2>
            <form>
                <div class="form-group">
                    <label for="name">نام (الزامی):</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">ایمیل:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="age">سن (۱۸-۶۵):</label>
                    <input type="number" id="age" name="age" min="18" max="65">
                </div>

                <div class="form-group">
                    <label for="username">نام‌کاربری (۶+ کاراکتر):</label>
                    <input type="text" id="username" name="username" minlength="6" maxlength="20">
                </div>

                <div class="form-group">
                    <label for="website">وبسایت:</label>
                    <input type="url" id="website" name="website" pattern="https?://.+" title="باید https:// شروع شود">
                </div>

                <div class="form-group">
                    <label for="phone">تلفن:</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="۱۰ رقم">
                </div>

                <button type="submit">ارسال</button>
            </form>
        </section>

        <section>
            <h2>Validation States</h2>
            <form>
                <div class="form-group">
                    <label for="password">رمز:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm">تایید رمز:</label>
                    <input type="password" id="confirm" name="confirm" required>
                </div>

                <button type="submit">ثبت</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
