<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div و Span</title>
    <link rel="stylesheet" href="DivAndSpan.css">
</head>
<body>
    <header>
        <h1>Div و Span</h1>
        <p>Grouping و layout elements</p>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <h2>کارت اول</h2>
                <p>این یک <span class="highlight">کارت</span> است که با div ایجاد شده.</p>
            </div>

            <div class="card">
                <h2>کارت دوم</h2>
                <p>هر کارت داخل یک div است و <span class="primary">styled</span> شده است.</p>
            </div>

            <div class="card">
                <h2>کارت سوم</h2>
                <p>داخل هر پاراگراف، <span class="badge">span</span> برای inline styling.</p>
            </div>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>این سایدبار یک div جداگانه است.</p>
        </div>
    </main>

    <footer>
        <p>&copy; ۲۰۲۵</p>
    </footer>
</body>
</html>
