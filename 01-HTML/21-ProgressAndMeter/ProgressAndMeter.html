<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress and Meter</title>
  <link rel="stylesheet" href="ProgressAndMeter.css">
</head>
<body>
  <main class="dashboard">
    <section class="panel">
      <h1>وضعیت پروژه</h1>
      <p>پیشرفت تسک‌ها</p>
      <progress value="72" max="100"></progress>
      <p>72% تکمیل شده</p>
    </section>

    <section class="panel">
      <h2>سطح عملکرد</h2>
      <meter min="0" max="100" value="78" low="40" high="80" optimum="90"></meter>
      <p>عملکرد خوب، اما هنوز فاصله تا هدف وجود دارد.</p>
    </section>
  </main>
</body>
</html>
