<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecommerce Project</title>
  <link rel="stylesheet" href="Ecommerce.css">
</head>
<body>
  <header>
    <nav>
      <a href="#">خانه</a>
      <a href="#">محصولات</a>
      <a href="#">تخفیف‌ها</a>
      <a href="#">عضویت</a>
    </nav>
    <input type="search" placeholder="جست‌وجو">
  </header>

  <main>
    <section class="categories">
      <h2>دسته‌بندی‌ها</h2>
      <article>لپ‌تاپ</article>
      <article>موبایل</article>
      <article>گوشی</article>
    </section>

    <section class="products">
      <h2>محصولات</h2>
      <article class="card">کارت محصول ۱</article>
      <article class="card">کارت محصول ۲</article>
      <article class="card">کارت محصول ۳</article>
    </section>

    <section class="offers">
      <h2>پیشنهاد ویژه</h2>
      <p>تخفیف‌های فصل جدید.</p>
    </section>

    <section class="newsletter">
      <h2>عضویت خبرنامه</h2>
      <form>
        <label for="email">ایمیل</label>
        <input id="email" type="email">
        <button type="button">ثبت</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 فروشگاه دیجیتال</p>
  </footer>
</body>
</html>
