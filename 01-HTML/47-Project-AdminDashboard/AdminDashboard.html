<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="AdminDashboard.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>پنل مدیریت</h1>
      <nav>
        <a href="#">داشبورد</a>
        <a href="#">کاربران</a>
        <a href="#">گزارش‌ها</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2>امار کلی</h2>
        <div class="profile">کاربر مدیر</div>
      </header>

      <section class="stats">
        <article class="card">کاربران: 1200</article>
        <article class="card">فروش: 84%</article>
        <article class="card">درآمد: 5.2M</article>
      </section>

      <section class="table-area">
        <table>
          <thead>
            <tr><th>نام</th><th>وضعیت</th></tr>
          </thead>
          <tbody>
            <tr><td>علی</td><td>فعال</td></tr>
            <tr><td>سارا</td><td>غیرفعال</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <footer>
    <p>© 2026 مدیریت داشبورد</p>
  </footer>
</body>
</html>
